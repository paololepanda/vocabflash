<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>VocabFlash</title>
<meta name="theme-color" content="#2B2D42">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#F7F7FA;
    --surface:#FFFFFF;
    --ink:#2B2D42;
    --ink-soft:#6B6E85;
    --accent:#EF8354;
    --accent-ink:#ffffff;
    --line:#E4E4EC;
    --good:#3FA34D;
    --bad:#D64550;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header.topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px 18px 10px;
  }
  header.topbar h1{
    font-size:19px;
    margin:0;
    flex:1;
  }
  .backbtn{
    background:none;
    border:none;
    font-size:20px;
    color:var(--ink);
    cursor:pointer;
    padding:4px 8px;
    line-height:1;
  }
  main{
    flex:1;
    padding:6px 18px 24px;
  }
  .screen{display:none;}
  .screen.active{display:block;}

  .card{
    background:var(--surface);
    border-radius:var(--radius);
    padding:16px;
    border:1px solid var(--line);
    margin-bottom:12px;
  }
  .btn{
    display:block;
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    border:none;
    background:var(--accent);
    color:var(--accent-ink);
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:10px;
    text-align:center;
  }
  .btn:active{opacity:0.85;}
  .btn.secondary{
    background:var(--surface);
    color:var(--ink);
    border:1px solid var(--line);
  }
  .btn.danger{
    background:var(--surface);
    color:var(--bad);
    border:1px solid var(--line);
  }
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .muted{color:var(--ink-soft);font-size:14px;}
  .row{display:flex;gap:10px;}
  .row .btn{flex:1;}
  input[type=text], input[type=number], select{
    width:100%;
    padding:11px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    font-size:15px;
    background:var(--surface);
    color:var(--ink);
    margin-bottom:10px;
  }
  label{font-size:13px;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .pill{
    display:inline-block;
    padding:4px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
  }
  .pill.mode-strict{background:#FDE8E1;color:#B9502B;}
  .pill.mode-tolerant{background:#E4F3E6;color:#2E7D39;}
  .pill.mode-qcm{background:#E7EBFB;color:#3B4FCE;}

  .pack-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .pack-item:last-child{border-bottom:none;}
  .pack-name{font-weight:600;}
  .pack-count{color:var(--ink-soft);font-size:13px;}

  #video-preview{
    width:100%;
    border-radius:12px;
    background:#000;
    margin-bottom:10px;
  }
  table.review-table{width:100%;border-collapse:collapse;margin-bottom:10px;}
  table.review-table th{
    text-align:left;font-size:12px;color:var(--ink-soft);
    padding:4px 6px;font-weight:600;
  }
  table.review-table td{padding:4px 4px;}
  table.review-table input{margin-bottom:0;padding:8px;font-size:14px;}
  .del-row-btn{
    background:none;border:none;color:var(--bad);font-size:18px;cursor:pointer;
  }

  .quiz-progress{font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  .quiz-word{
    font-size:26px;
    font-weight:700;
    text-align:center;
    padding:28px 12px;
    margin-bottom:14px;
  }
  .qcm-options .btn{margin-bottom:8px;}
  #quiz-feedback{
    text-align:center;
    font-weight:600;
    margin-bottom:10px;
    min-height:22px;
  }
  #quiz-feedback.good{color:var(--good);}
  #quiz-feedback.bad{color:var(--bad);}

  .memory-grid{
    display:grid;
    gap:8px;
    margin-bottom:14px;
  }
  .mem-card{
    aspect-ratio:3/4;
    border-radius:10px;
    background:var(--surface);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:600;
    text-align:center;
    padding:4px;
    cursor:pointer;
    user-select:none;
    line-height:1.2;
  }
  .mem-card.hidden-face{background:var(--ink);color:var(--ink);}
  .mem-card.matched{background:#E4F3E6;border-color:#B7E0BC;color:#2E7D39;cursor:default;}
  .mem-card.wrong{background:#FDE8E1;border-color:#F3B9A4;}

  .stat-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;}
  .empty-state{
    text-align:center;
    padding:40px 16px;
    color:var(--ink-soft);
  }
  #toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:999px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s;
    z-index:50;
  }
  #toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <button class="backbtn" id="backBtn" style="visibility:hidden;">←</button>
    <h1 id="screenTitle">VocabFlash</h1>
  </header>

  <main>

    <!-- HOME -->
    <section class="screen active" id="screen-home">
      <div class="card">
        <p class="muted" style="margin-top:0;">Prends en photo une liste de vocabulaire, ou entraîne-toi sur celles déjà enregistrées.</p>
      </div>
      <button class="btn" onclick="goTo('screen-capture')">📷 Prendre une photo de vocabulaire</button>
      <button class="btn secondary" onclick="goTo('screen-quiz-setup'); refreshListChoices('quiz')">🧠 Lancer un quiz</button>
      <button class="btn secondary" onclick="goTo('screen-memory-setup'); refreshListChoices('memory')">🃏 Jeu de mémoire (paires)</button>
      <button class="btn secondary" onclick="goTo('screen-packs'); renderPacks()">📚 Gérer mes listes</button>
    </section>

    <!-- CAPTURE -->
    <section class="screen" id="screen-capture">
      <div class="card" id="capture-step-photo">
        <label>Photo de la feuille de vocabulaire</label>
        <input type="file" accept="image/*" capture="environment" id="photoInput" style="margin-bottom:10px;">
        <img id="capturedPreview" style="width:100%;border-radius:10px;display:none;margin-bottom:10px;">
        <p class="muted" id="ocrStatus"></p>
        <button class="btn" id="analyzeBtn" onclick="runOCR()" disabled>Analyser la photo</button>
      </div>

      <div class="card" id="capture-step-file">
        <label>Ou importer un fichier (PDF, Word, TXT, CSV)</label>
        <input type="file" accept=".pdf,.doc,.docx,.txt,.csv,text/plain,text/csv,application/pdf" id="fileImportInput" style="margin-bottom:10px;">
        <p class="muted" id="fileImportStatus"></p>
        <button class="btn" id="analyzeFileBtn" onclick="runFileImport()" disabled>Analyser le fichier</button>
      </div>

      <div class="card" id="capture-step-review" style="display:none;">
        <label>Vérifie et corrige les paires détectées</label>
        <p class="muted" style="margin-top:-4px;">Corrige les erreurs de reconnaissance avant d'enregistrer.</p>
        <table class="review-table" id="reviewTable">
          <thead><tr><th>Anglais</th><th>Traduction</th><th></th></tr></thead>
          <tbody id="reviewTbody"></tbody>
        </table>
        <button class="btn secondary" onclick="addReviewRow()">+ Ajouter une ligne</button>
        <label style="margin-top:10px;">Nom de la liste</label>
        <input type="text" id="packNameInput" placeholder="ex : Chapitre 3 - Verbes">
        <button class="btn" onclick="savePackFromReview()">Enregistrer la liste</button>
      </div>
    </section>

    <!-- PACKS MANAGEMENT -->
    <section class="screen" id="screen-packs">
      <div class="card" id="packsListCard">
      </div>
    </section>

    <!-- QUIZ SETUP -->
    <section class="screen" id="screen-quiz-setup">
      <div class="card">
        <label>Quelle liste veux-tu réviser ?</label>
        <select id="quizListSelect"></select>
        <p class="muted" id="quizListInfo"></p>
        <button class="btn" onclick="startQuiz()">Démarrer le quiz (20 cartes)</button>
      </div>
    </section>

    <!-- QUIZ -->
    <section class="screen" id="screen-quiz">
      <div class="quiz-progress" id="quizProgress"></div>
      <div class="card">
        <span class="pill" id="quizModePill"></span>
        <div class="quiz-word" id="quizWord"></div>
        <div id="quizAnswerZone"></div>
        <div id="quiz-feedback"></div>
      </div>
    </section>

    <!-- QUIZ RESULT -->
    <section class="screen" id="screen-quiz-result">
      <div class="card" style="text-align:center;">
        <p class="muted" style="margin-top:0;">Résultat</p>
        <div style="font-size:40px;font-weight:700;" id="quizScoreBig"></div>
        <p class="muted" id="quizScoreSub"></p>
      </div>
      <button class="btn" onclick="goTo('screen-quiz-setup'); refreshListChoices('quiz')">Refaire un quiz</button>
      <button class="btn secondary" onclick="goTo('screen-home')">Retour à l'accueil</button>
    </section>

    <!-- MEMORY SETUP -->
    <section class="screen" id="screen-memory-setup">
      <div class="card">
        <label>Avec quelle liste je dois faire le memory ?</label>
        <select id="memoryListSelect" onchange="updateMemoryPairOptions()"></select>
        <label>Nombre de paires de départ</label>
        <select id="memoryPairsSelect"></select>
        <button class="btn" onclick="startMemory()">Démarrer</button>
      </div>
    </section>

    <!-- MEMORY GAME -->
    <section class="screen" id="screen-memory">
      <div class="stat-row">
        <span id="memoryLevelLabel"></span>
        <span id="memoryMistakesLabel"></span>
      </div>
      <div class="memory-grid" id="memoryGrid"></div>
    </section>

    <!-- MEMORY RESULT -->
    <section class="screen" id="screen-memory-result">
      <div class="card" style="text-align:center;">
        <p class="muted" style="margin-top:0;" id="memoryResultTitle"></p>
        <div style="font-size:20px;font-weight:700;" id="memoryResultDetail"></div>
      </div>
      <button class="btn" id="memoryNextLevelBtn" style="display:none;">Niveau suivant</button>
      <button class="btn secondary" onclick="retryMemorySameLevel()">Rejouer ce niveau</button>
      <button class="btn secondary" onclick="goTo('screen-memory-setup'); refreshListChoices('memory')">Changer de niveau / liste</button>
      <button class="btn secondary" onclick="goTo('screen-home')">Retour à l'accueil</button>
    </section>

  </main>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="app.js"></script>
</body>
</html>
